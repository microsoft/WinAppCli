trigger:
  branches:
    include:
      - main
      - dev/**
  tags:
    exclude:
      - '*'
pr: none

resources:
  repositories:
  - repository: 1esPipelines
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1esPipelines
  parameters:
    settings:
      networkIsolationPolicy: Permissive,CFSClean
    sdl:
      policheck:
        enabled: true
        break: true
        severity: 'Warning'
      sourceAnalysisPool:
        name: Azure-Pipelines-1ESPT-ExDShared
        image: windows-latest
        os: windows
    stages:
    - stage: Build
      jobs:
      - job: Build
        pool:
          name: Azure-Pipelines-1ESPT-ExDShared
          image: windows-latest
          os: windows
          hostArchitecture: amd64
        steps:
          - checkout: self
          - task: UseDotNet@2
            displayName: Setup .NET 10
            inputs:
              version: 10.0.x
          - task: UseNode@1
            displayName: Setup Node.js 24
            inputs:
              version: '24.x'
          - script: move /Y $(Build.SourcesDirectory)\.pipelines\release-nuget.config $(Build.SourcesDirectory)\nuget.config
            displayName: Add release package source
          - task: NuGetAuthenticate@1
          - script: move /Y $(Build.SourcesDirectory)\.pipelines\release-npmrc $(Build.SourcesDirectory)\.npmrc
            displayName: Add release npm source
          - task: npmAuthenticate@0
            inputs:
              workingFile: $(Build.SourcesDirectory)\.npmrc
          - template: ./.pipelines/templates/build.yaml@self
            parameters:
              stable: 'false'
              DoEsrp: false
              signingIdentity: {}