trigger: none
pr: none

resources:
  repositories:
  - repository: 1esPipelines
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

parameters:
  - name: symbolsIdentity
    type: object
    default:
      serviceConnection: $(SymbolPublishingServiceConnection)
      project: $(SymbolPublishingProject)

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    settings:
      networkIsolationPolicy: Permissive,CFSClean2
    sdl:
      sourceAnalysisPool:
        name: Azure-Pipelines-1ESPT-ExDShared
        image: windows-latest
        os: windows
    stages:
    - stage: VerifySymbols
      jobs:
      - job: verify
        displayName: Same steps the release stage runs
        pool:
          name: Azure-Pipelines-1ESPT-ExDShared
          image: windows-latest
          os: windows
          hostArchitecture: amd64
        steps:
          - checkout: none

          # Identical to the release stage's token step.
          - task: AzurePowerShell@5
            displayName: Acquire symbol request API token
            inputs:
              azureSubscription: ${{ parameters.symbolsIdentity.serviceConnection }}
              azurePowerShellVersion: LatestVersion
              pwsh: true
              ScriptType: InlineScript
              Inline: |-
                $token = (Get-AzAccessToken -AsSecureString -ResourceUrl api://30471ccf-0966-45b9-a979-065dbedb24c1).Token |
                    ConvertFrom-SecureString -AsPlainText
                Write-Host "token length: $($token.Length)"
                Write-Host "##vso[task.setvariable variable=SymbolAccessToken;issecret=true]$token"

          # 403 or 404-on-request means we reached the project as an authorized caller.
          - pwsh: |-
              $ErrorActionPreference = 'Stop'
              $uri = "https://symbolrequestprod.trafficmanager.net/projects/${{ parameters.symbolsIdentity.project }}/requests/verify-probe-does-not-exist"
              Write-Host "GET $uri"
              try {
                  $r = Invoke-RestMethod -Uri $uri -Headers @{ Authorization = "Bearer $(SymbolAccessToken)" } -Method Get
                  Write-Host "200 OK: $($r | ConvertTo-Json -Compress -Depth 3)"
              } catch {
                  Write-Host "HTTP $([int]$_.Exception.Response.StatusCode)"
                  if ($_.ErrorDetails.Message) { Write-Host "body: $($_.ErrorDetails.Message)" }
              }
            displayName: Reach the symbol project