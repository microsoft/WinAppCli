trigger:
  branches:
    include:
      - rel/v*
pr: none

resources:
  repositories:
  - repository: 1esPipelines
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

parameters:
  - name: DoEsrp
    displayName: Sign the binaries and package (DoEsrp)
    type: boolean
    default: true
  - name: signingIdentity
    type: object
    default:
      serviceName: $(SigningServiceName)
      appId: $(SigningAppId)
      tenantId: $(SigningTenantId)
      akvName: $(SigningAKVName)
      authCertName: $(SigningAuthCertName)
      signCertName: $(SigningSignCertName)
      signTTSCertName: $(SigningSignTTSCertName)
  - name: GitHubReleaseAlreadyExists
    displayName: GitHub Release already exists, skip uploading GitHub release (GitHubReleaseAlreadyExists)
    type: boolean
    default: false
  - name: SkipVscRelease
    displayName: Skip VS Code Marketplace publish (SkipVscRelease)
    type: boolean
    default: true
  - name: CliReleaseTag
    displayName: CLI release tag to bundle in VS Code extension (empty = latest stable)
    type: string
    default: ''

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    sdl:
      sourceAnalysisPool:
        name: Azure-Pipelines-1ESPT-ExDShared
        image: windows-latest
        os: windows
    stages:
    - stage: Build
      jobs:
      - job: Build
        pool:
          name: Azure-Pipelines-1ESPT-ExDShared
          image: windows-latest
          os: windows
          hostArchitecture: amd64
        steps:
          - checkout: self
          - task: UseDotNet@2
            displayName: Setup .NET 10
            inputs:
              version: 10.0.x
          - ${{ if eq(parameters.DoEsrp, 'true') }}:
            - task: UseDotNet@2
              displayName: Setup .NET 6.0 (For ESRP Task)
              inputs:
                packageType: runtime
                version: 6.0.x
          - task: UseNode@1
            displayName: Setup Node.js 24
            inputs:
              version: '24.x'
          - script: move /Y $(Build.SourcesDirectory)\.pipelines\release-nuget.config $(Build.SourcesDirectory)\nuget.config
            displayName: Add release package source
          - task: NuGetAuthenticate@1
          - task: PowerShell@2
            displayName: Replace Stubbed Files
            inputs:
              filePath: '.pipelines/Unstub.ps1'
              arguments: '-TelemetryProviderGuid "$(TelemetryProviderGuid)"' 
          - template: ./.pipelines/templates/build.yaml@self
            parameters:
              stable: 'true'
              skipVsc: true
              DoEsrp: ${{ parameters.DoEsrp }}
              signingIdentity: ${{ parameters.signingIdentity }}
          - task: PowerShell@2
            displayName: Download public CLI release for VS Code extension
            inputs:
              pwsh: true
              targetType: 'inline'
              script: |
                $cliReleaseTag = "${{ parameters.CliReleaseTag }}"
                $repo = "microsoft/winappcli"

                if ([string]::IsNullOrWhiteSpace($cliReleaseTag)) {
                    Write-Host "No CLI release tag specified, finding latest stable release..."
                    $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases" -Headers @{ "User-Agent" = "AzurePipelines" }
                    $stableRelease = $releases | Where-Object { -not $_.prerelease -and -not $_.draft } | Select-Object -First 1
                    if (-not $stableRelease) {
                        Write-Error "No stable release found for $repo"
                        exit 1
                    }
                    $cliReleaseTag = $stableRelease.tag_name
                    Write-Host "Found latest stable release: $cliReleaseTag"
                } else {
                    Write-Host "Using specified CLI release tag: $cliReleaseTag"
                }

                Write-Host "##vso[task.setvariable variable=CliReleaseTag]$cliReleaseTag"

                # Download x64 and arm64 CLI zips
                $downloadBase = "https://github.com/$repo/releases/download/$cliReleaseTag"
                $cliDir = "$(System.DefaultWorkingDirectory)/artifacts/public-cli"

                New-Item -ItemType Directory -Path "$cliDir/win-x64" -Force | Out-Null
                New-Item -ItemType Directory -Path "$cliDir/win-arm64" -Force | Out-Null

                $x64Url = "$downloadBase/winappcli-x64.zip"
                $arm64Url = "$downloadBase/winappcli-arm64.zip"

                Write-Host "Downloading x64 CLI from: $x64Url"
                Invoke-WebRequest -Uri $x64Url -OutFile "$cliDir/x64.zip"
                if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$cliDir/x64.zip")) {
                    Write-Error "Failed to download x64 CLI from $x64Url"
                    exit 1
                }

                Write-Host "Downloading arm64 CLI from: $arm64Url"
                Invoke-WebRequest -Uri $arm64Url -OutFile "$cliDir/arm64.zip"
                if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$cliDir/arm64.zip")) {
                    Write-Error "Failed to download arm64 CLI from $arm64Url"
                    exit 1
                }

                # Extract
                Expand-Archive -Path "$cliDir/x64.zip" -DestinationPath "$cliDir/win-x64" -Force
                Expand-Archive -Path "$cliDir/arm64.zip" -DestinationPath "$cliDir/win-arm64" -Force

                # Validate
                if (-not (Test-Path "$cliDir/win-x64/winapp.exe")) {
                    Write-Error "winapp.exe not found in extracted x64 archive"
                    exit 1
                }
                if (-not (Test-Path "$cliDir/win-arm64/winapp.exe")) {
                    Write-Error "winapp.exe not found in extracted arm64 archive"
                    exit 1
                }

                Write-Host "CLI binaries ($cliReleaseTag) downloaded and validated successfully"
          - task: PowerShell@2
            displayName: Package VS Code extension with public CLI
            inputs:
              pwsh: true
              filePath: $(System.DefaultWorkingDirectory)\scripts\package-vsc.ps1
              arguments: "-Stable -CliBinariesPath '$(System.DefaultWorkingDirectory)/artifacts/public-cli'"
          - task: CopyFiles@2
            displayName: Copy Artifacts - VS Code Extension
            inputs:
              sourceFolder: '$(System.DefaultWorkingDirectory)/artifacts/'
              contents: '*.vsix'
              targetFolder: '$(Build.ArtifactStagingDirectory)/vscode-extension'
          - task: 1ES.PublishPipelineArtifact@1
            displayName: Upload Artifact - VS Code Extension
            inputs:
              path: '$(Build.ArtifactStagingDirectory)/vscode-extension'
              artifactName: vscode-extension
          - task: PowerShell@2
            name: SetMeta
            displayName: Export version
            inputs:
              targetType: inline
              script: |
                # Get version info
                $versionJson = Get-Content "version.json" | ConvertFrom-Json
                $baseVersion = $versionJson.version
                $fullVersion = "$baseVersion"

                Write-Host "Version: $fullVersion"

                Write-Host "##vso[task.setvariable variable=version;isOutput=true]$fullVersion"
          - task: PowerShell@2
            displayName: "Generate Release Notes"
            continueOnError: true
            env:
              GH_TOKEN: $(GITHUB_TOKEN_2)
              GH_MODELS_TOKEN: $(GH_MODELS_TOKEN)
            inputs:
              pwsh: true
              filePath: '$(System.DefaultWorkingDirectory)/scripts/generate-release-notes.ps1'
              arguments: '-CurrentTag "v$(SetMeta.version)" -CurrentRef "$(Build.SourceVersion)" -OutputPath "$(Build.ArtifactStagingDirectory)/release-notes/release-notes.md"'
          - task: PowerShell@2
            displayName: "Compose Full Release Body"
            inputs:
              pwsh: true
              targetType: 'inline'
              script: |
                $outDir = "$(Build.ArtifactStagingDirectory)/release-notes"
                if (-not (Test-Path $outDir)) { New-Item -ItemType Directory -Path $outDir -Force | Out-Null }

                $aiNotes = ""
                $notesPath = "$outDir/release-notes.md"
                if (Test-Path $notesPath) {
                    $aiNotes = Get-Content $notesPath -Raw
                }

                $versionJson = Get-Content "version.json" | ConvertFrom-Json
                $fullVersion = $versionJson.version

                $lines = @(
                    "## Installation Options"
                    ""
                    "### MSIX Installer (Recommended)"
                    "1. Download ``winappcli_x64.msix`` for x64 or ``winappcli_arm64.msix`` for ARM64"
                    "2. Double-click to install"
                    "3. Automatically added to PATH"
                    ""
                    "### Standalone CLI Binaries"
                    "1. Download ``winappcli-x64.zip`` for x64 or ``winappcli-arm64.zip`` for ARM64"
                    "2. Extract to your desired location"
                    "3. Add to PATH or run directly: ``winapp.exe``"
                    ""
                    "### NPM Package (for Electron or NodeJS)"
                    "``````bash"
                    "npm install microsoft-winappcli.tgz"
                    "``````"
                    ""
                    "## What's Included"
                    "- MSIX installer packages (x64 and ARM64)"
                    "- Standalone CLI binaries (x64 and ARM64)"
                    "- NPM package for NodeJS/Electron integration"
                )
                $installationNotes = $lines -join "`n"

                $fullBody = "Version: ``$fullVersion```n"
                $fullBody += "Commit: ``$(Build.SourceVersion)```n`n"
                if ($aiNotes) {
                    $fullBody += $aiNotes + "`n`n---`n`n"
                }
                $fullBody += $installationNotes

                $fullBody | Set-Content "$outDir/full-release-notes.md" -Encoding UTF8 -NoNewline
                Write-Host "Release body written ($($fullBody.Length) chars)"
          - task: 1ES.PublishPipelineArtifact@1
            displayName: Upload Artifact - Release Notes
            inputs:
              path: '$(Build.ArtifactStagingDirectory)/release-notes'
              artifactName: release-notes

    - stage: Release_GitHub
      displayName: Create GitHub Release
      dependsOn: Build
      variables:
        version: $[ stageDependencies.Build.Build.outputs['SetMeta.version'] ]
      jobs:
      - job: create_github_release
        pool:
          name: Azure-Pipelines-1ESPT-ExDShared
          image: windows-latest
          os: windows
          hostArchitecture: amd64
        displayName: GitHub Release
        templateContext:
          type: releaseJob
          isProduction: true
          inputs:
          - input: pipelineArtifact
            artifactName: cli-binaries
            targetPath: $(Pipeline.Workspace)/cli-binaries
          - input: pipelineArtifact
            artifactName: npm-package
            targetPath: $(Pipeline.Workspace)/npm-package
          - input: pipelineArtifact
            artifactName: msix-packages
            targetPath: $(Pipeline.Workspace)/msix-packages
          - input: pipelineArtifact
            artifactName: release-notes
            targetPath: $(Pipeline.Workspace)/release-notes
          - input: pipelineArtifact
            artifactName: nuget-packages
            targetPath: $(Pipeline.Workspace)/nuget-packages
          - input: pipelineArtifact
            artifactName: vscode-extension
            targetPath: $(Pipeline.Workspace)/vscode-extension
        steps:
          - task: ArchiveFiles@2
            displayName: Archive CLI binaries - x64
            inputs:
              rootFolderOrFile: $(Pipeline.Workspace)/cli-binaries/win-x64
              includeRootFolder: false
              archiveFile: $(Pipeline.Workspace)/winappcli-x64.zip

          - task: ArchiveFiles@2
            displayName: Archive CLI binaries - arm64
            inputs:
              rootFolderOrFile: $(Pipeline.Workspace)/cli-binaries/win-arm64
              includeRootFolder: false
              archiveFile: $(Pipeline.Workspace)/winappcli-arm64.zip
          
          - task: PowerShell@2
            displayName: Rename files
            inputs:
              targetType: 'inline'
              script: |
                # Rename MSIX files, removing version in between underscores, keeping anything after the next underscore
                Get-ChildItem "$(Pipeline.Workspace)/msix-packages/" -Filter "*.msix" | ForEach-Object {
                  $newName = $_.Name -replace 'winappcli_(.+?)_(.+)', 'winappcli_$2'
                  Rename-Item -Path $_.FullName -NewName $newName
                }

                # Rename NPM package to remove the version from the filename
                Get-ChildItem "$(Pipeline.Workspace)/npm-package/" -Filter "*.tgz" | ForEach-Object {
                  $newName = $_.Name -replace 'microsoft-winappcli-(.+?).tgz', 'microsoft-winappcli.tgz'
                  Rename-Item -Path $_.FullName -NewName $newName
                }

                # Rename NuGet packages to remove the version from the filename
                Get-ChildItem "$(Pipeline.Workspace)/nuget-packages/" -Filter "*.nupkg" | ForEach-Object {
                  $newName = $_.Name -replace '\.(\d+\.\d+\.\d+.*)\.nupkg$', '.nupkg'
                  Rename-Item -Path $_.FullName -NewName $newName
                }

          - ${{ if ne(parameters.GitHubReleaseAlreadyExists, 'true') }}:
            - task: GitHubRelease@1
              displayName: "Create GitHub Release"
              inputs:
                gitHubConnection: 'github-service-connection'
                repositoryName: 'microsoft/winappcli'
                action: 'create'
                target: '$(Build.SourceVersion)'
                tagSource: 'userSpecifiedTag'
                tag: 'v$(version)'
                title: 'Release v$(version)'
                isPreRelease: true
                assets: |
                  $(Pipeline.Workspace)/winappcli-*.zip
                  $(Pipeline.Workspace)/msix-packages/*.msix
                  $(Pipeline.Workspace)/npm-package/*.tgz
                  $(Pipeline.Workspace)/nuget-packages/*.nupkg
                  $(Pipeline.Workspace)/vscode-extension/*.vsix
                assetUploadMode: 'delete'
                addChangeLog: false
                releaseNotesSource: 'filePath'
                releaseNotesFilePath: '$(Pipeline.Workspace)/release-notes/full-release-notes.md'

    - ${{ if eq(parameters.DoEsrp, 'true') }}:
      - stage: Release_Npm
        displayName: Create Npm Release
        dependsOn: Release_GitHub
        jobs:
        - job: create_npm_release
          pool:
            name: Azure-Pipelines-1ESPT-ExDShared
            image: windows-latest
            os: windows
            hostArchitecture: amd64
          displayName: NPM Release
          templateContext:
            type: releaseJob
            isProduction: true
            inputs:
            - input: pipelineArtifact
              artifactName: npm-package
              targetPath: $(Pipeline.Workspace)/npm-package
          steps:
            - task: PowerShell@2
              displayName: "Echo debug info"
              inputs:
                targetType: 'inline'
                script: |
                  Write-Host "SigningServiceName: ${{ parameters.signingIdentity.serviceName }}"
            - task: EsrpRelease@10
              condition: always()
              inputs:
                ConnectedServiceName: ${{ parameters.signingIdentity.serviceName }}
                usemanagedidentity: false
                keyvaultname: ${{ parameters.signingIdentity.akvName }}
                authcertname: ${{ parameters.signingIdentity.authCertName }}
                signcertname: ${{ parameters.signingIdentity.signCertName }}
                clientid: ${{ parameters.signingIdentity.appId }}
                intent: 'PackageDistribution'
                contenttype: 'npm'
                contentsource: 'Folder'
                folderlocation: $(Pipeline.Workspace)/npm-package/
                waitforreleasecompletion: true
                owners: '$(EsrpOwnersEmail)'
                approvers: '$(EsrpApproversEmail)'
                serviceendpointurl: 'https://api.esrp.microsoft.com'
                mainpublisher: 'ESRPRELPACMAN'
                domaintenantid: ${{ parameters.signingIdentity.tenantId }}

    - ${{ if eq(parameters.DoEsrp, 'true') }}:
      - stage: Release_NuGet
        displayName: Publish the NuGet Release
        dependsOn: Release_GitHub
        jobs:
        - job: create_nuget_release
          pool:
            name: Azure-Pipelines-1ESPT-ExDShared
            image: windows-latest
            os: windows
            hostArchitecture: amd64
          displayName: NuGet Release
          templateContext:
            type: releaseJob
            isProduction: true
            inputs:
            - input: pipelineArtifact
              artifactName: nuget-packages
              targetPath: $(Pipeline.Workspace)/nuget-packages
          steps:
            - task: 1ES.PublishNuget@1
              displayName: 'NuGet push to nuget.org'
              inputs:
                packagesToPush: '$(Pipeline.Workspace)/nuget-packages/*.nupkg'
                packageParentPath: '$(Pipeline.Workspace)/nuget-packages'
                nuGetFeedType: external
                publishFeedCredentials: 'NuGet-WinAppCLI'

    - stage: Release_WinGet
      displayName: Create WinGet Release
      dependsOn: [Build, Release_GitHub]
      variables:
        version: $[ stageDependencies.Build.Build.outputs['SetMeta.version'] ]
      jobs:
      - job: create_winget_release
        pool:
          name: Azure-Pipelines-1ESPT-ExDShared
          image: windows-latest
          os: windows
          hostArchitecture: amd64
        displayName: WinGet Release
        templateContext:
          type: releaseJob
          isProduction: true
        steps:
          - task: PowerShell@2
            displayName: "Publish to WinGet"
            env:
              # PAT lasts 90 days, regenerate as needed and re-run if it failes due to authentication
              WINGET_CREATE_GITHUB_TOKEN: $(GITHUB_TOKEN_2)
              GH_TOKEN: $(GITHUB_TOKEN_2)
            inputs:
              targetType: 'inline'
              errorActionPreference: 'stop'
              script: |
                # Download and install C++ Runtime framework package
                Write-Host "Installing VCLibs dependency..."
                $vcLibsFile = "Microsoft.VCLibs.x64.14.00.Desktop.appx"
                Invoke-WebRequest https://aka.ms/Microsoft.VCLibs.x64.14.00.Desktop.appx -OutFile $vcLibsFile
                Add-AppxPackage $vcLibsFile
                
                # Install gh
                # TODO: Change this to get the latest version of gh
                Write-Host "Installing gh..."
                $tempDir = "$(Agent.TempDirectory)"
                Write-Host "TempDir: $tempDir"
                Invoke-WebRequest -Uri "https://github.com/cli/cli/releases/download/v2.83.1/gh_2.83.1_windows_amd64.zip" -OutFile "$tempdir\gh.zip"
                Expand-Archive "$tempdir\gh.zip" -DestinationPath "$tempDir\gh"

                # Download and install wingetcreate
                Write-Host "Installing wingetcreate..."
                $wingetCreateBundle = "wingetcreate.msixbundle"
                Invoke-WebRequest https://aka.ms/wingetcreate/latest/msixbundle -OutFile $wingetCreateBundle
                Add-AppxPackage $wingetCreateBundle

                # WinGetCreate uses an existing fork of the microsoft/winget-pkgs repo to create the PR
                # that updates the main repo.  This fork will be under the account attached to the token.
                # We need to keep this fork up-to-date, otherwise the wingetcreate command will fail.
                # See: https://github.com/microsoft/winget-create/issues/502
                Write-Host "Syncing winget-pkgs fork..."
                & "$tempDir\gh\bin\gh.exe" repo sync $(WingetPkgsFork) -b master
                if ($LASTEXITCODE -ne 0) {
                  Write-Error "Failed to sync winget-pkgs fork. Exit code: $LASTEXITCODE"
                  exit $LASTEXITCODE
                }
                Write-Host "Fork synced successfully."
                
                # Get the installer URLs from the GitHub release
                $x64MsixUrl = "https://github.com/microsoft/winappcli/releases/download/v$(version)/winappcli_x64.msix"
                $arm64MsixUrl = "https://github.com/microsoft/winappcli/releases/download/v$(version)/winappcli_arm64.msix"
                
                Write-Host "Submitting to WinGet..."
                Write-Host "Version: $(version)"
                Write-Host "x64 MSIX: $x64MsixUrl"
                Write-Host "ARM64 MSIX: $arm64MsixUrl"
                
                # Submit to WinGet repository
                wingetcreate update Microsoft.WinAppCli `
                  --version $(version) `
                  --urls $x64MsixUrl $arm64MsixUrl `
                  --submit

    - ${{ if ne(parameters.SkipVscRelease, 'true') }}:
      - stage: Release_VSC
        displayName: Publish VS Code Extension
        dependsOn: Build
        variables:
        - group: vsceMarketplaceIdentity
        jobs:
        - job: publish_vsc_extension
          pool:
            name: Azure-Pipelines-1ESPT-ExDShared
            image: windows-latest
            os: windows
            hostArchitecture: amd64
          displayName: VS Code Marketplace
          templateContext:
            type: releaseJob
            isProduction: true
            inputs:
            - input: pipelineArtifact
              artifactName: vscode-extension
              targetPath: $(Pipeline.Workspace)/vscode-extension
          steps:
            - task: UseNode@1
              displayName: Setup Node.js 24
              inputs:
                version: '24.x'
            - task: PowerShell@2
              displayName: Create temporary .npmrc
              inputs:
                targetType: inline
                script: |
                  $npmrcContent = "registry=https://pkgs.dev.azure.com/microsoft/pde-oss/_packaging/winapp-npm-feed/npm/registry/`nalways-auth=true"
                  Set-Content -Path ".npmrc" -Value $npmrcContent
                  Write-Host "Created .npmrc for Azure Artifacts feed"
            - task: npmAuthenticate@0
              displayName: Authenticate with Azure Artifacts feed
              inputs:
                workingFile: '.npmrc'
            - task: PowerShell@2
              displayName: "Publish to VS Code Marketplace"
              env:
                VSCE_PAT: $(VSCE_PAT)
              inputs:
                targetType: 'inline'
                errorActionPreference: 'stop'
                script: |
                  Write-Host "Installing @vscode/vsce..."
                  npm install @vscode/vsce
                  if ($LASTEXITCODE -ne 0) {
                    Write-Error "Failed to install @vscode/vsce"
                    exit 1
                  }

                  $vsix = Get-ChildItem "$(Pipeline.Workspace)/vscode-extension/" -Filter "*.vsix" | Select-Object -First 1
                  if (-not $vsix) {
                    Write-Error "No VSIX file found in vscode-extension artifact"
                    exit 1
                  }

                  $sizeMB = [math]::Round($vsix.Length / 1MB, 2)
                  Write-Host "Publishing $($vsix.Name) ($sizeMB MB) to VS Code Marketplace..."

                  npx vsce publish --packagePath $vsix.FullName
                  if ($LASTEXITCODE -ne 0) {
                    Write-Error "Failed to publish to VS Code Marketplace"
                    exit 1
                  }

                  Write-Host "Successfully published to VS Code Marketplace!"

    - ${{ if ne(parameters.SkipVscRelease, 'true') }}:
      - stage: Bump_VSC_Version
        displayName: Bump VS Code Extension Version
        dependsOn: Release_VSC
        jobs:
        - job: bump_vsc_version
          pool:
            name: Azure-Pipelines-1ESPT-ExDShared
            image: windows-latest
            os: windows
            hostArchitecture: amd64
          displayName: Create Version Bump PR
          templateContext:
            type: releaseJob
            isProduction: true
          steps:
            - checkout: self
              persistCredentials: true
            - task: PowerShell@2
              displayName: "Bump patch version and create PR"
              env:
                GH_TOKEN: $(GITHUB_TOKEN_2)
              inputs:
                targetType: 'inline'
                errorActionPreference: 'stop'
                pwsh: true
                script: |
                  $packageJsonPath = "src/winapp-VSC/package.json"
                  $packageJson = Get-Content $packageJsonPath -Raw | ConvertFrom-Json
                  $currentVersion = $packageJson.version
                  Write-Host "Current version: $currentVersion"

                  # Parse and bump patch version
                  $parts = $currentVersion -split '\.'
                  $major = [int]$parts[0]
                  $minor = [int]$parts[1]
                  $patch = [int]$parts[2]
                  $newVersion = "$major.$minor.$($patch + 1)"
                  Write-Host "New version: $newVersion"

                  # Create branch
                  $branchName = "auto/bump-vsc-$newVersion"
                  git checkout -b $branchName
                  if ($LASTEXITCODE -ne 0) {
                    Write-Error "Failed to create branch"
                    exit 1
                  }

                  # Update package.json
                  $raw = Get-Content $packageJsonPath -Raw
                  $raw = $raw -replace "`"version`":\s*`"$currentVersion`"", "`"version`": `"$newVersion`""
                  Set-Content -Path $packageJsonPath -Value $raw -NoNewline
                  Write-Host "Updated $packageJsonPath"

                  # Commit and push
                  git config user.email "pde-oss-build@microsoft.com"
                  git config user.name "WinApp Pipeline"
                  git add $packageJsonPath
                  git commit -m "Bump VS Code extension version to $newVersion"
                  git push origin $branchName
                  if ($LASTEXITCODE -ne 0) {
                    Write-Error "Failed to push branch"
                    exit 1
                  }

                  # Create PR
                  gh pr create `
                    --title "Bump VS Code extension version to $newVersion" `
                    --body "Auto-generated after successful publish of v$currentVersion to the VS Code Marketplace." `
                    --base main `
                    --head $branchName
                  if ($LASTEXITCODE -ne 0) {
                    Write-Error "Failed to create PR"
                    exit 1
                  }

                  Write-Host "Successfully created version bump PR!"
