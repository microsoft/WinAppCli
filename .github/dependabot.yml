version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    groups:
      github-actions:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "nuget"
    directory: "/src/winapp-CLI"
    groups:
      nuget:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    directory: "/src/winapp-npm"
    groups:
      npm:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
