name: Test Samples & Guides

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      sample:
        description: 'Specific sample to test (or "all")'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - cpp-app
          - dotnet-app
          - electron
          - flutter-app
          - packaging-cli
          - rust-app
          - tauri-app
          - wpf-app
          - winui-app
          - winui-solution
          - winui-unpackaged-app

permissions:
  contents: read

jobs:
  # Build npm (and NuGet) package for pull_request and workflow_dispatch events.
  # This makes the workflow self-contained — no cross-workflow artifact chaining.
  build:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
    - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        dotnet-version: '10.0.x'
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: '22'
    - name: Build npm package
      shell: pwsh
      run: .\scripts\build-cli.ps1 -SkipTests -SkipMsix
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: npm-package
        path: artifacts/*.tgz
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: nuget-package
        path: artifacts/nuget/*.nupkg
        if-no-files-found: ignore

  test-sample:
    needs: [build]
    if: needs.build.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        sample: [cpp-app, dotnet-app, electron, flutter-app, packaging-cli, rust-app, tauri-app, wpf-app, winui-app, winui-solution, winui-unpackaged-app]
    runs-on: windows-latest
    name: ${{ matrix.sample }}

    steps:
    - name: Check if sample should run
      id: check
      shell: pwsh
      run: |
        $requested = '${{ github.event.inputs.sample || 'all' }}'
        if ($requested -ne 'all' -and $requested -ne '${{ matrix.sample }}') {
          echo "skip=true" >> $env:GITHUB_OUTPUT
        } else {
          echo "skip=false" >> $env:GITHUB_OUTPUT
        }

    - name: Checkout
      if: steps.check.outputs.skip != 'true'
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    # Download the npm package artifact built by the `build` job above
    - name: Download npm package
      if: steps.check.outputs.skip != 'true'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: npm-package
        path: artifacts/npm

    # Download NuGet package for .NET samples
    - name: Download NuGet package
      if: >-
        steps.check.outputs.skip != 'true' &&
        contains(fromJson('["dotnet-app", "wpf-app"]'), matrix.sample)
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: nuget-package
        path: artifacts/nuget
      continue-on-error: true

    - name: Add local NuGet source
      if: >-
        steps.check.outputs.skip != 'true' &&
        contains(fromJson('["dotnet-app", "wpf-app"]'), matrix.sample)
      shell: pwsh
      run: |
        $nugetPath = "artifacts/nuget"
        if (Test-Path $nugetPath) {
          $resolvedPath = (Resolve-Path $nugetPath).Path
          dotnet nuget add source $resolvedPath --name WinAppLocal
          Write-Host "Added local NuGet source: $resolvedPath"
        } else {
          Write-Warning "No NuGet artifacts found — .NET samples may fail to restore"
        }

    # --- Toolchain setup (conditional per sample) ---

    - name: Setup .NET
      if: >-
        steps.check.outputs.skip != 'true' &&
        contains(fromJson('["dotnet-app", "wpf-app", "packaging-cli", "electron", "winui-app", "winui-solution", "winui-unpackaged-app"]'), matrix.sample)
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        dotnet-version: '10.0.x'

    - name: Setup Node.js
      if: >-
        steps.check.outputs.skip != 'true' &&
        contains(fromJson('["electron", "tauri-app", "cpp-app", "dotnet-app", "wpf-app", "rust-app", "flutter-app", "packaging-cli", "winui-app", "winui-solution", "winui-unpackaged-app"]'), matrix.sample)
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: '22'

    - name: Setup Flutter
      if: >-
        steps.check.outputs.skip != 'true' &&
        matrix.sample == 'flutter-app'
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        channel: stable

    - name: Setup Rust
      if: >-
        steps.check.outputs.skip != 'true' &&
        contains(fromJson('["rust-app", "tauri-app"]'), matrix.sample)
      uses: dtolnay/rust-toolchain@stable

    # --- Run the sample's self-contained Pester test ---

    # Hosted Windows images ship Pester 5.x, so this normally short-circuits.
    # When it does need to install, PSGallery registration/download is a known
    # flake ("Missing option value for: '-source'"), so retry before failing.
    - name: Install Pester
      if: steps.check.outputs.skip != 'true'
      shell: pwsh
      run: |
        function Get-Pester5 {
          Get-Module -Name Pester -ListAvailable |
            Where-Object { $_.Version.Major -ge 5 } |
            Sort-Object Version -Descending |
            Select-Object -First 1
        }

        $pester = Get-Pester5
        if (-not $pester) {
          foreach ($attempt in 1..3) {
            try {
              if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
                Register-PSRepository -Default -ErrorAction Stop
              }
              Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction Stop
              Install-Module -Name Pester -Force -SkipPublisherCheck -Scope CurrentUser -MinimumVersion 5.0 -Repository PSGallery -ErrorAction Stop
            } catch {
              Write-Host "::warning::Pester install attempt $attempt failed: $($_.Exception.Message)"
            }

            $pester = Get-Pester5
            if ($pester) { break }
            if ($attempt -lt 3) { Start-Sleep -Seconds (10 * $attempt) }
          }
        }

        if (-not $pester) {
          Write-Error "Pester 5.x is not available after 3 install attempts"
          exit 1
        }
        Write-Host "Using Pester $($pester.Version)"

    - name: Run ${{ matrix.sample }} test
      if: steps.check.outputs.skip != 'true'
      shell: pwsh
      run: |
        $container = New-PesterContainer -Path "samples/${{ matrix.sample }}/test.Tests.ps1" -Data @{
          WinappPath = "artifacts/npm"
        }
        $config = New-PesterConfiguration
        $config.Run.Container = $container
        $config.Run.Exit = $true
        $config.Output.Verbosity = 'Detailed'
        $config.TestResult.Enabled = $true
        $config.TestResult.OutputPath = "test-results-${{ matrix.sample }}.xml"
        $config.TestResult.OutputFormat = 'JUnitXml'
        Invoke-Pester -Configuration $config

    - name: Upload test results
      if: always() && steps.check.outputs.skip != 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: test-results-${{ matrix.sample }}
        path: test-results-${{ matrix.sample }}.xml
        if-no-files-found: ignore

  # Summary job to provide a single check status for branch protection
  test-samples-result:
    if: always()
    needs: [build, test-sample]
    runs-on: ubuntu-latest
    steps:
    - name: Check results
      run: |
        if [ "${{ needs.test-sample.result }}" = "failure" ]; then
          echo "::error::One or more sample tests failed"
          exit 1
        fi
        echo "All sample tests passed (or were skipped)"
