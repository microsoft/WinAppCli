name: Build and Package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write  # Required for creating releases
  pull-requests: write  # Required for binary size report comments
  actions: write  # Required for deleting old metrics baseline cache

jobs:
  # Fast docs validation - runs in parallel with the main build to fail PRs early on doc drift
  # Only builds the CLI binary (no tests, npm, or MSIX) so it completes much faster
  validate-docs:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install .NET Core
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.0.x

    - name: Build and publish CLI (x64 only)
      run: dotnet publish src/winapp-CLI/WinApp.Cli/WinApp.Cli.csproj -c Release -r win-x64 --self-contained -o artifacts/cli/win-x64

    - name: Validate CLI schema and plugin manifests
      run: .\scripts\validate-llm-docs.ps1 -FailOnDrift

  build-and-package:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # Required for build number calculation
    
    - name: Install .NET Core
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.0.x
    
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'
    
    # Run the build script which handles building, testing, versioning, npm packaging, and MSIX bundling
    # Skip doc generation in CI - we validate the committed docs separately to detect drift
    - name: Build, test, and package
      id: build
      run: |
        .\scripts\build-cli.ps1 -SkipDocs
        
        # Get version information for release tagging
        $versionJson = Get-Content "version.json" | ConvertFrom-Json
        $baseVersion = $versionJson.version
        $buildNumber = & ".\scripts\get-build-number.ps1"
        
        # Determine prerelease label based on current branch
        $prereleaseLabel = & ".\scripts\get-prerelease-label.ps1"
        $fullVersion = "$baseVersion-$prereleaseLabel.$buildNumber"
        
        # Export for use in subsequent steps
        echo "version=$fullVersion" >> $env:GITHUB_OUTPUT
        echo "base_version=$baseVersion" >> $env:GITHUB_OUTPUT
        echo "build_number=$buildNumber" >> $env:GITHUB_OUTPUT
    
    # Validate CLI schema and plugin manifests on push to main (warning only, not blocking)
    - name: Validate CLI schema and plugin manifests
      if: github.event_name != 'pull_request'
      run: .\scripts\validate-llm-docs.ps1 -FailOnDrift:$false
    
    # Upload all build artifacts
    - name: Upload test results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-results
        path: artifacts/TestResults/
        if-no-files-found: error
    
    - name: Upload CLI binaries
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: cli-binaries
        path: artifacts/cli/
        if-no-files-found: error
    
    - name: Upload npm package
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: npm-package
        path: artifacts/*.tgz
        if-no-files-found: error

    - name: Upload MSIX packages
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: msix-packages
        path: artifacts/msix-packages/
        if-no-files-found: error

    - name: Upload NuGet packages
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: nuget-packages
        path: artifacts/nuget/
        if-no-files-found: error

    # --- Build quality metrics ---
    - name: Collect build metrics
      if: ${{ !cancelled() }}
      uses: ./.github/actions/collect-metrics

    - name: Report build metrics
      if: ${{ !cancelled() }}
      uses: ./.github/actions/report-metrics
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}

  # NOTE: The "mark metrics comment as stale" job that used to live here
  # has moved to .github/workflows/mark-metrics-stale.yml so it can run on
  # `pull_request_target` and obtain write permissions for fork PRs.

  # E2E test for winapp ui commands against WinUI 3 sample app
  e2e-test-ui:
    runs-on: windows-latest
    needs: build-and-package
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Enable Windows Developer Mode
      run: |
        reg add "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /v "AllowDevelopmentWithoutDevLicense" /d 1 /f

    - name: Setup .NET 10
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: "10.0.x"

    - name: Download CLI binaries
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: cli-binaries
        path: artifacts/cli

    - name: Run WinUI UI E2E test
      run: |
        $platform = if ($env:PROCESSOR_ARCHITECTURE -eq "ARM64") { "arm64" } else { "x64" }
        .\scripts\test-e2e-winui-ui.ps1 -WinAppPath "artifacts/cli/win-$platform/winapp.exe"

    # Cooperative desktop-turn coverage (issue #764 §18.2/§18.3). These drive real winapp.exe child
    # processes against a real foreground window, so they are gated off the canonical build and only
    # run here, on the interactive lane, after the CLI binaries above are on disk. Without this step
    # the gate was never set by any workflow and all of them silently skipped everywhere.
    - name: Run UI coordination multiprocess and real-app tests
      env:
        WINAPP_UI_MULTIPROCESS_TESTS: "1"
      run: |
        $filter = "FullyQualifiedName~InteractiveDesktopMultiprocessTests|FullyQualifiedName~InteractiveDesktopRealAppTests"
        $results = Join-Path $PWD "artifacts/TestResults/ui-coordination"
        New-Item -ItemType Directory -Path $results -Force | Out-Null

        dotnet run --project src/winapp-CLI/WinApp.Cli.Tests/WinApp.Cli.Tests.csproj -c Debug `
          --results-directory $results --report-trx --report-trx-filename ui-coordination.trx `
          --filter $filter
        $testExit = $LASTEXITCODE

        # A skip here is a silent failure: it means the gate or the published-binary lookup regressed and
        # nothing was actually verified. Assert against the TRX rather than trusting the exit code, which
        # is 0 for a run that skipped everything.
        $trx = Get-ChildItem -Path $results -Filter *.trx -Recurse | Sort-Object LastWriteTime | Select-Object -Last 1
        if (-not $trx) { throw "No TRX produced: the UI coordination tests did not run." }

        [xml]$doc = Get-Content $trx.FullName
        $counters = $doc.TestRun.ResultSummary.Counters
        $total = [int]$counters.total
        $passed = [int]$counters.passed
        $failed = [int]$counters.failed
        # MSTest reports Assert.Inconclusive (the gate's skip path) under notExecuted.
        $skipped = [int]$counters.notExecuted + [int]$counters.inconclusive
        Write-Host "UI coordination tests: total=$total passed=$passed failed=$failed skipped=$skipped"

        # Currently 8 multiprocess + 3 real-app = 11. Asserted dynamically rather than pinned to 11 so
        # adding coverage does not fail the build, while a filter that stops matching still does.
        if ($total -eq 0) { throw "The UI coordination filter matched no tests — it no longer selects the gated suites." }
        if ($skipped -gt 0) { throw "$skipped UI coordination test(s) skipped; the gate must run them here, not skip them." }
        if ($failed -gt 0 -or $testExit -ne 0) { throw "UI coordination tests failed (exit $testExit)." }

    - name: Upload UI coordination test results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ui-coordination-test-results
        path: artifacts/TestResults/ui-coordination/
        if-no-files-found: warn

    - name: Upload screenshots
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ui-test-screenshots
        path: artifacts/screenshots/
        if-no-files-found: warn
