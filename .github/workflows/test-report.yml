name: 'Test Report'
on:
  workflow_run:
    workflows: [Build and Package]
    types:
      - completed
permissions:
  contents: read
  actions: read
  checks: write
jobs:
  report:
    name: Test
    runs-on: windows-latest
    steps:
    - name: Display test results
      uses: dorny/test-reporter@df6247429542221bc30d46a036ee47af1102c451 # v2.7.0
      with:
        artifact: test-results
        name: Test - Results
        path: '**/*.trx'
        reporter: dotnet-trx
